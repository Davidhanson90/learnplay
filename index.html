<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="learnplay — train a tiny neural network in the browser and watch the decision boundary learn live."
    />
    <title>learnplay — neural net playground</title>
    <style>
      header.app-header {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 16px 8px;
      }
      header.app-header h1 {
        margin: 0 0 6px;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      header.app-header p {
        margin: 0;
        color: var(--lp-muted, #9aa8bc);
        max-width: 62ch;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 16px 48px;
      }
      footer {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px 32px;
        font-size: 0.85rem;
        color: var(--lp-muted, #9aa8bc);
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>learnplay</h1>
      <p>
        A tiny from-scratch neural net in your browser. Pick a toy dataset (or click to draw your
        own), hit Train, and watch the decision boundary and loss curve update live — no API keys,
        no backend.
      </p>
    </header>
    <main>
      <lp-playground></lp-playground>
    </main>
    <footer>
      Pure TypeScript MLP · Lit · Vite ·
      <a href="https://github.com/Davidhanson90/learnplay">GitHub</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
